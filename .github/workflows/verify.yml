name: Verify full game

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out private candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: npm run check
      - name: Full-game tests
        run: npm test
      - name: Sandbox route audit
        run: npm run audit:sandboxes
